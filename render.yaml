services:
  - type: web
    name: neurovoice-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: "http://localhost:5173,http://127.0.0.1:5173,https://neurovoice-deploy.vercel.app,https://neurovoice.vercel.app"
